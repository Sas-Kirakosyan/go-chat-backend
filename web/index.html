<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go-chat-backend — dev client</title>
<style>
  :root {
    --bg: #10151c;
    --panel: #161d27;
    --line: #26303d;
    --text: #e6edf3;
    --dim: #8b98a9;
    --accent: #4f8cff;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.on { background: var(--ok); }
  .dot.wait { background: var(--warn); }

  button {
    font: inherit;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  input {
    font: inherit;
    background: #0d1218;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    min-width: 0;
  }
  input:focus { outline: 1px solid var(--accent); }

  /* login */
  #login {
    margin: auto;
    width: 320px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #login h2 { margin: 0 0 4px; font-size: 16px; }
  #login .row { display: flex; gap: 8px; }
  #login .row button { flex: 1; }
  .hint { color: var(--dim); font-size: 12px; }
  .error { color: var(--bad); font-size: 13px; min-height: 18px; }

  /* app */
  #app { flex: 1; display: none; min-height: 0; }
  #app.on { display: flex; }

  #rooms {
    width: 230px;
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  #roomsHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 6px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    text-transform: uppercase;
    color: var(--dim);
  }
  #roomsHead button { padding: 2px 8px; font-size: 14px; line-height: 1.2; }
  #roomList { flex: 1; overflow-y: auto; }
  .room {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .room:hover { background: #1b2431; }
  .room.active { background: #1e2a3a; box-shadow: inset 3px 0 0 var(--accent); }
  .room .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 0 7px;
    font-size: 11px;
    font-weight: 600;
  }
  .newRoom { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  .newRoom input { flex: 1; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHead {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #chatHead .who { color: var(--dim); font-size: 12px; }
  #messages { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .msg { margin-bottom: 10px; max-width: 640px; }
  .msg .meta { color: var(--dim); font-size: 12px; }
  .msg .body {
    background: #1b2431;
    border-radius: 8px;
    padding: 7px 11px;
    display: inline-block;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.mine { margin-left: auto; text-align: right; }
  .msg.mine .body { background: #24405f; }
  .seq { font-variant-numeric: tabular-nums; }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #composer input { flex: 1; }
  .empty { color: var(--dim); margin: auto; text-align: center; padding: 40px; }

  #log {
    width: 300px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  #log h3 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
  #logLines { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .line { margin-bottom: 4px; color: var(--dim); word-break: break-word; }
  .line b { color: var(--text); font-weight: 600; }
  .line.ws b { color: var(--accent); }
  .line.gap b { color: var(--warn); }
  .line.err b { color: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>go-chat-backend</h1>
  <span class="hint" id="apiLabel"></span>
  <span class="spacer"></span>
  <span class="hint" id="me"></span>
  <span class="dot" id="wsDot" title="WebSocket"></span>
  <span class="hint" id="wsText">socket: off</span>
  <button class="ghost" id="logoutBtn" hidden>Log out</button>
</header>

<div id="login">
  <h2>Sign in</h2>
  <!-- autocomplete is off on purpose. The browser's saved password silently
       replaces the seeded default below, and the login then fails with a 401
       that looks like a broken backend. -->
  <input id="username" placeholder="username" autocomplete="off" value="testuser001">
  <input id="password" type="password" placeholder="password" autocomplete="off" value="password123">
  <div class="row">
    <button id="loginBtn">Log in</button>
    <button class="ghost" id="registerBtn">Register</button>
    <button class="ghost" id="resetBtn" title="Put the seeded username and password back">↺</button>
  </div>
  <div class="error" id="loginErr"></div>
  <div class="hint">
    API: <span id="apiHint"></span><br>
    Seeded users: <code>testuser001</code> / <code>password123</code> (<code>make seed</code>)
  </div>
</div>

<div id="app">
  <aside id="rooms">
    <div id="roomsHead">
      <span>Rooms</span>
      <!-- Being added to a room does not push anything down the socket, so the
           other window needs a way to ask again without a full reload. -->
      <button class="ghost" id="refreshBtn" title="Reload the room list">&#8635;</button>
    </div>
    <div id="roomList"></div>
    <form class="newRoom" id="newRoomForm">
      <input id="newRoomTitle" placeholder="new room title" required>
      <button>+</button>
    </form>
  </aside>

  <main id="chat">
    <div id="chatHead">
      <strong id="roomTitle">No room selected</strong>
      <span class="who" id="roomWho"></span>
      <span class="spacer" style="flex:1"></span>
      <input id="memberId" placeholder="user id, e.g. 2" title="The number, not the name. It is shown in the top bar of that user's window." style="width:130px">
      <button class="ghost" id="addMemberBtn">Add member</button>
    </div>
    <div id="messages"><div class="empty">Pick a room on the left.</div></div>
    <form id="composer">
      <input id="text" placeholder="Type a message…" autocomplete="off" disabled>
      <button id="sendBtn" disabled>Send</button>
    </form>
  </main>

  <aside id="log">
    <h3>Event log</h3>
    <div id="logLines"></div>
  </aside>
</div>

<script>
// ---------------------------------------------------------------------------
// This page is a dev client for the Go backend. It is one file on purpose:
// every call it makes is visible in one place.
//
// It talks to the API on :8080 and must itself be served from :5173, because
// that is the only origin the server's CORS config and the WebSocket
// CheckOrigin allow.
// ---------------------------------------------------------------------------

// ?api=http://localhost:8081 points the page at one node instead of at nginx.
// That is how the two-node behaviour becomes visible: put this browser on
// api1 and the other on api2, send a message, and the frame that arrives in
// the other window travelled through NATS to get there.
const API = new URLSearchParams(location.search).get("api") || "http://localhost:8080";
const WS = API.replace(/^http/, "ws") + "/ws";

// --- state ------------------------------------------------------------------

const state = {
  token: localStorage.getItem("token") || "",
  userId: null,
  username: "",
  rooms: [],
  roomId: null,
  // Per room: the highest seq we have shown. This is what makes a dropped
  // socket repairable — on reconnect we ask for everything after it.
  maxSeq: {},
  // Per room: seqs already on screen. Delivery is at-least-once, so the same
  // message can arrive twice and the copy must be dropped.
  seen: {},
  socket: null,
  retry: 0,
};

const $ = (id) => document.getElementById(id);

// --- log --------------------------------------------------------------------

function log(kind, head, rest = "") {
  const el = document.createElement("div");
  el.className = "line " + kind;
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `<b>${head}</b> ${escapeHTML(rest)} <span style="opacity:.5">${time}</span>`;
  $("logLines").prepend(el);
  while ($("logLines").children.length > 200) $("logLines").lastChild.remove();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// --- http -------------------------------------------------------------------

// api() is the only place that talks HTTP. It puts the access token on every
// request, and on a 401 it tries POST /auth/refresh once and replays the call.
// That is the whole point of the two-token design: the 15 minute token dies
// often, and the user must not see a login screen when it does.
async function api(path, options = {}, retried = false) {
  const headers = Object.assign({}, options.headers);
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  if (options.body) headers["Content-Type"] = "application/json";

  const res = await fetch(API + path, {
    method: options.method || "GET",
    headers,
    body: options.body,
    credentials: "include", // the refresh cookie
  });

  // A 401 here means "this access token is old", so refresh it once and try
  // again. The three routes below are excluded because a 401 from them means
  // something else entirely — the credentials were wrong — and refreshing
  // would hide that behind a second, unrelated failure.
  const credentialRoute = path === "/auth/refresh" || path === "/login" || path === "/register";
  if (res.status === 401 && !retried && !credentialRoute) {
    if (await refresh()) return api(path, options, true);
  }

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || res.status + " " + res.statusText);
  return data;
}

async function refresh() {
  let res;
  try {
    res = await fetch(API + "/auth/refresh", { method: "POST", credentials: "include" });
  } catch (e) {
    // The node is down or the network is gone. That says nothing about the
    // session, so the login is kept and the caller retries. Logging out here
    // would turn a node restart into "please sign in again", which is exactly
    // what the refresh cookie exists to avoid.
    log("err", "refresh unreachable", e.message);
    return false;
  }

  // 401 is the one answer that means the session itself is finished: the
  // cookie is missing, expired, or was revoked by a logout.
  if (res.status === 401) {
    log("err", "session expired");
    signOut();
    return false;
  }
  if (!res.ok) {
    log("err", "refresh failed", res.status + " " + res.statusText);
    return false;
  }

  const data = await res.json();
  setToken(data.token);
  log("ws", "token refreshed", "expires_in=" + data.expires_in + "s");
  return true;
}

function setToken(token) {
  state.token = token;
  localStorage.setItem("token", token);
  const claims = JSON.parse(atob(token.split(".")[1]));
  state.userId = claims.user_id;
  state.username = claims.username;
  $("me").textContent = `${claims.username} (id ${claims.user_id})`;
}

// --- auth -------------------------------------------------------------------

$("loginBtn").onclick = () => submitAuth("/login");
$("registerBtn").onclick = () => submitAuth("/register");

async function submitAuth(path) {
  $("loginErr").textContent = "";
  const body = JSON.stringify({ username: $("username").value, password: $("password").value });
  try {
    const data = await api(path, { method: "POST", body });
    if (path === "/register") {
      log("", "registered", $("username").value);
      return submitAuth("/login");
    }
    setToken(data.token);
    log("", "logged in", "token good for " + data.expires_in + "s");
    await start();
  } catch (e) {
    // "Unauthorized" is all the server will say, on purpose: naming which half
    // was wrong tells someone probing for accounts which usernames are real.
    $("loginErr").textContent =
      e.message === "Unauthorized" ? "Wrong username or password." : e.message;
    log("err", path, e.message);
  }
}

// Puts the seeded defaults back, for when the browser has filled in something
// of its own.
$("resetBtn").onclick = () => {
  $("username").value = "testuser001";
  $("password").value = "password123";
  $("loginErr").textContent = "";
};

$("logoutBtn").onclick = async () => {
  try { await fetch(API + "/auth/logout", { method: "POST", credentials: "include" }); } catch (e) {}
  signOut();
};

function signOut() {
  localStorage.removeItem("token");
  state.token = "";
  if (state.socket) { state.socket.onclose = null; state.socket.close(); state.socket = null; }
  $("app").classList.remove("on");
  $("login").style.display = "flex";
  $("logoutBtn").hidden = true;
  $("me").textContent = "";
  setWsDot("", "socket: off");
}

// --- rooms ------------------------------------------------------------------

async function loadRooms() {
  const data = await api("/conversations");
  state.rooms = data.conversations;
  renderRooms();
  log("", "GET /conversations", state.rooms.length + " rooms");
}

function renderRooms() {
  const list = $("roomList");
  list.innerHTML = "";
  for (const room of state.rooms) {
    const el = document.createElement("div");
    el.className = "room" + (room.id === state.roomId ? " active" : "");
    el.innerHTML = `<span class="title">${escapeHTML(room.title)}</span>` +
      (room.unread_count > 0 ? `<span class="badge">${room.unread_count}</span>` : "");
    el.onclick = () => openRoom(room.id);
    list.append(el);
  }
  if (!state.rooms.length) {
    list.innerHTML = `<div class="empty">No rooms yet.<br>Create one below.</div>`;
  }
}

$("refreshBtn").onclick = () => loadRooms();

$("newRoomForm").onsubmit = async (e) => {
  e.preventDefault();
  const title = $("newRoomTitle").value.trim();
  if (!title) return;
  const room = await api("/conversations", { method: "POST", body: JSON.stringify({ title }) });
  $("newRoomTitle").value = "";
  log("", "POST /conversations", "id=" + room.id);
  await loadRooms();
  openRoom(room.id);
};

$("addMemberBtn").onclick = async () => {
  const id = parseInt($("memberId").value, 10);
  if (!state.roomId || !id) return;
  try {
    const user = await api(`/conversations/${state.roomId}/members`, {
      method: "POST", body: JSON.stringify({ user_id: id }),
    });
    $("memberId").value = "";
    log("", "added member", user.username);
    await loadRooms();
    openRoom(state.roomId);
  } catch (e) {
    log("err", "add member failed", e.message);
  }
};

// --- messages ---------------------------------------------------------------

async function openRoom(id) {
  state.roomId = id;
  state.seen[id] = new Set();
  state.maxSeq[id] = 0;

  const room = state.rooms.find((r) => r.id === id);
  $("roomTitle").textContent = room ? room.title : "room " + id;
  $("roomWho").textContent = room ? "members: " + room.members.map((m) => `${m.username}#${m.id}`).join(", ") : "";
  $("text").disabled = false;
  $("sendBtn").disabled = false;
  $("messages").innerHTML = "";

  // History comes back newest first, so it is reversed to read top to bottom.
  const page = await api(`/conversations/${id}/messages?limit=50`);
  log("", `GET /conversations/${id}/messages`, page.messages.length + " messages");
  for (const m of page.messages.slice().reverse()) addMessage(m, false);
  scrollDown();

  // The room is on screen, so the badge is no longer true.
  await api(`/conversations/${id}/read`, { method: "POST" });
  if (room) room.unread_count = 0;
  renderRooms();
}

function addMessage(m, animate = true) {
  const room = m.conversation_id;
  if (!state.seen[room]) state.seen[room] = new Set();

  // The duplicate check. Two copies of one message is normal here: the socket
  // may deliver it, and a gap read may hand it over again.
  if (state.seen[room].has(m.seq)) {
    log("gap", "duplicate dropped", "seq=" + m.seq);
    return;
  }
  state.seen[room].add(m.seq);
  if (m.seq > (state.maxSeq[room] || 0)) state.maxSeq[room] = m.seq;

  if (room !== state.roomId) return; // it belongs to another room

  const el = document.createElement("div");
  el.className = "msg" + (m.sender.id === state.userId ? " mine" : "");
  el.innerHTML =
    `<div class="meta"><span class="seq">#${m.seq}</span> ` +
    `${escapeHTML(m.sender.username)} · ${new Date(m.created_at).toLocaleTimeString()}</div>` +
    `<div class="body">${escapeHTML(m.content)}</div>`;
  $("messages").append(el);
  if (animate) scrollDown();
}

function scrollDown() {
  $("messages").scrollTop = $("messages").scrollHeight;
}

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const content = $("text").value.trim();
  if (!content || !state.roomId) return;
  $("text").value = "";

  // client_msg_id makes a retry safe: send the same one twice and the server
  // answers 200 with the first message instead of writing a second row.
  const body = JSON.stringify({ content, client_msg_id: crypto.randomUUID() });
  try {
    const msg = await api(`/conversations/${state.roomId}/messages`, { method: "POST", body });
    log("", "POST message", "seq=" + msg.seq);
    // Shown right away. The socket will push the same message back, and the
    // seq check above drops that copy.
    addMessage(msg);
  } catch (e) {
    log("err", "send failed", e.message);
  }
};

// --- websocket --------------------------------------------------------------

function setWsDot(cls, text) {
  $("wsDot").className = "dot " + cls;
  $("wsText").textContent = text;
}

function connect() {
  setWsDot("wait", "socket: connecting");
  const socket = new WebSocket(WS + "?token=" + encodeURIComponent(state.token));
  state.socket = socket;

  socket.onopen = () => {
    state.retry = 0;
    setWsDot("on", "socket: live");
    log("ws", "socket open");
    repairGap(); // anything sent while we were away
  };

  socket.onmessage = (e) => {
    const frame = JSON.parse(e.data);
    if (frame.type === "connected") {
      log("ws", "connected", "user_id=" + frame.data.user_id);
      return;
    }
    if (frame.type === "message.new") {
      const m = frame.data;
      log("ws", "message.new", `room=${m.conversation_id} seq=${m.seq}`);
      addMessage(m);
      bumpUnread(m);
      return;
    }
    log("ws", frame.type, e.data.slice(0, 80));
  };

  socket.onclose = () => {
    setWsDot("", "socket: closed");
    // The hub closes the socket when the access token expires, so a reconnect
    // needs a fresh token first.
    const wait = Math.min(1000 * 2 ** state.retry++, 10000);
    log("err", "socket closed", "retry in " + wait / 1000 + "s");
    setTimeout(async () => {
      if (!state.token) return;
      await refresh();
      if (state.token) connect();
    }, wait);
  };
}

// The repair path. The socket is best effort: a frame sent while we were
// offline is simply gone. The seq numbers say what is missing, and
// ?after_seq= brings it back, oldest first, in pages.
async function repairGap() {
  if (!state.roomId) return;
  let after = state.maxSeq[state.roomId] || 0;
  let found = 0;
  for (;;) {
    const page = await api(`/conversations/${state.roomId}/messages?after_seq=${after}&limit=100`);
    for (const m of page.messages) { addMessage(m, false); found++; }
    if (!page.next_after_seq) break;
    after = page.next_after_seq;
  }
  log("gap", "gap check", found ? `recovered ${found} messages after seq ${state.maxSeq[state.roomId]}` : "nothing missed");
  if (found) scrollDown();
}

function bumpUnread(m) {
  if (m.conversation_id === state.roomId) {
    api(`/conversations/${m.conversation_id}/read`, { method: "POST" }).catch(() => {});
    return;
  }
  const room = state.rooms.find((r) => r.id === m.conversation_id);
  if (room) { room.unread_count = (room.unread_count || 0) + 1; renderRooms(); }
}

// --- start ------------------------------------------------------------------

async function start() {
  $("login").style.display = "none";
  $("app").classList.add("on");
  $("logoutBtn").hidden = false;
  await loadRooms();
  connect();
}

$("apiHint").textContent = API;
$("apiLabel").textContent = "→ " + API;

// A token from a previous visit may still be good. Try it; if it is dead the
// refresh cookie fixes it, and only then does a login screen appear.
(async () => {
  if (!state.token) return;
  try {
    setToken(state.token);
    await api("/auth/profile");
    await start();
  } catch (e) {
    signOut();
  }
})();
</script>
</body>
</html>
