# Prometheus for local use. Started only with the compose profile:
#
#   docker compose --profile observability up -d
#
# Then http://localhost:9090 — try:
#   rate(chat_http_requests_total[1m])
#   histogram_quantile(0.99, sum by (le, route) (rate(chat_http_request_duration_seconds_bucket[1m])))
#   chat_ws_connections_open
#   rate(chat_messages_stored_total[1m])
global:
  # 5 seconds rather than the usual 15: this is one machine being watched by
  # hand, and a load test that lasts 20 seconds needs more than one data point.
  scrape_interval: 5s

scrape_configs:
  - job_name: chat-api
    static_configs:
      # The compose service names, on their own network. Not localhost: inside
      # a container that would be the Prometheus container itself.
      #
      # Both nodes are scraped separately, and each series keeps an `instance`
      # label saying which one it came from. That is the point from Stage 3 on:
      # "500 sockets are open" is not a useful number if it is really 500 on one
      # node and 0 on the other.
      - targets: ["api1:8080", "api2:8080"]

  # Stage 6. The presence service is its own process, so it is its own job.
  #
  # Its port here is not the gRPC port: a gRPC server cannot serve a Prometheus
  # text page, so presenced runs a small HTTP listener beside it for /metrics
  # and /livez. That is the usual shape — the data plane speaks gRPC and the
  # operational surface speaks HTTP, because everything that watches a service
  # already knows how to scrape one.
  #
  # Worth comparing side by side:
  #   chat_presence_calls_total          what the API nodes tried
  #   chat_presence_store_failures_total what the service actually failed at
  #   chat_presence_breaker_open         whether the API nodes gave up asking
  - job_name: presence
    static_configs:
      - targets: ["presenced:9091"]
