# nginx in front of two API nodes. This is the file that makes Stage 3 real:
# until now there was one process, and "the hub" and "every socket in the
# system" were the same thing.
#
# It is deliberately plain. No TLS, no caching, no tuning. The only job here is
# to put two nodes behind one address so the split-brain bug can happen.

events {
    worker_connections 4096;
}

http {
    # A WebSocket handshake is an HTTP request that asks to stop being one:
    #
    #   Connection: Upgrade
    #   Upgrade: websocket
    #
    # A proxy that forwards those two headers blindly breaks normal requests,
    # because Connection is hop-by-hop. This map sends "upgrade" only when the
    # client actually asked for one, and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        # Round robin, on purpose. Sticky sessions (ip_hash) would hide the bug
        # by keeping each client on one node forever, and hiding the bug is the
        # opposite of this stage.
        server api1:8080;
        server api2:8080;
    }

    # The API's own logs are structured JSON now, so nginx writing sentences
    # would be the odd one out in `docker compose logs`.
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","request_id":"$http_x_request_id",'
        '"duration_s":$request_time,"bytes":$body_bytes_sent}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server {
        listen 80;

        location / {
            proxy_pass http://api;

            # HTTP/1.1 is required for an upgrade. nginx talks 1.0 upstream by
            # default, and 1.0 has no Upgrade.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            # The node sees nginx's address as the client address, so every
            # request would come from one IP and the per-IP rate limit would
            # count the whole world as one caller. These headers carry the real
            # address through — and gin only believes them because
            # SetTrustedProxies now names this proxy.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A quiet WebSocket must not be cut off. The default is 60s of
            # silence, and the server's ping is every 54s, so the default would
            # work by nine seconds — too close to call. Ten minutes leaves the
            # decision to the heartbeat, where it belongs.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
