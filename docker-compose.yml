# Stage 3 turned this file into a small cluster: one database, two API nodes,
# and nginx in front of them. Stage 5 added the broker they now talk through.
# Stage 6 added the second service.
#
#   docker compose up --build            database + redis + nats + presenced + api1 + api2 + nginx
#   docker compose --profile observability up -d   ... and Prometheus
#
# Ports:
#   8080  nginx, the address a client should use
#   8081  api1 directly
#   8082  api2 directly
#   8222  the NATS monitoring page
#   9095  presenced, gRPC (try: grpcurl -plaintext localhost:9095 list)
#   9096  presenced, /metrics
#
# Inside the network presenced is on 9090 and 9091. The published ports are
# different because Prometheus already owns 9090 on this machine — the same
# trap the database and Redis ports fell into. What the API nodes use is the
# internal one; the published pair exists only so a person can poke at it.
#
# The two node ports are not how a client is meant to connect. They exist so a
# test can say "put this socket on that node" and prove what each node does or
# does not know. cmd/splitcheck uses them.

# Everything both API nodes share. YAML anchors keep it in one place, so the
# two services differ only in the ways they are supposed to differ.
x-api: &api
  build: .
  restart: unless-stopped
  depends_on:
    psql_bp:
      condition: service_healthy
    nats:
      condition: service_healthy
    # service_started, not service_healthy. A node must be able to start while
    # the presence service is down — that is the whole claim of Stage 6, and a
    # depends_on that waits for health would quietly make it false. The gRPC
    # connection is made lazily on the first call, so a node that starts first
    # simply picks presence up when it appears.
    #
    # Note that redis is gone from this list. The API nodes no longer have a
    # Redis client at all; presenced owns it now.
    presenced:
      condition: service_started
  environment: &api-env
    PORT: 8080
    APP_ENV: production
    JWT_SECRET: ${JWT_SECRET}
    # Compose gives every service a DNS name on the shared network, so the
    # host here is the service name rather than localhost. Inside the
    # network Postgres is on its real port, 5432, not the 5433 published
    # to the host.
    BLUEPRINT_DB_HOST: psql_bp
    BLUEPRINT_DB_PORT: 5432
    BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
    BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
    BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
    BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA}
    # gin believes X-Forwarded-For only from an address named here. Without
    # it, any client could claim another IP and walk around the per-IP rate
    # limit by sending one header.
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    # The presence service. Unset it and a node still runs, still stores
    # messages and still delivers them; "online" simply shrinks to mean "has a
    # socket on this node".
    #
    # This replaced REDIS_ADDR in Stage 6. The address is a service, not a
    # datastore, and that is the whole difference: a node can no longer read or
    # write presence itself, it can only ask.
    PRESENCE_ADDR: presenced:9090
    # The one setting that turns single-node mode into cluster mode. Unset it
    # and a node still accepts everything and still pushes to its own sockets —
    # it simply stops hearing about anyone else's.
    #
    # Note what it does NOT control: whether a send works. The message and the
    # instruction to deliver it are one transaction in Postgres, so a node with
    # no broker at all still takes writes and hands them over when it returns.
    NATS_URL: nats://nats:4222

services:
  psql_bp:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
    ports:
      # Host 5434, not 5432 and not 5433. This machine runs PostgreSQL
      # natively, and it holds both of those: 5432 for the main instance and
      # 5433 for a second one. 5433 was worse than a plain conflict — Docker
      # took the IPv6 address and the native server kept IPv4, so a host tool
      # connecting to "localhost:5433" reached one or the other depending on
      # which address family it picked, and the error was a password failure
      # rather than anything about the wrong server.
      #
      # Inside the compose network the container is still reached on 5432.
      - "5434:5432"
    volumes:
      # Postgres 18 moved the data dir convention: the mount belongs at
      # /var/lib/postgresql, and PGDATA becomes a versioned subdirectory of it.
      # Mounting the old /var/lib/postgresql/data makes 18 ignore the volume
      # and refuse to start.
      - psql_volume_bp:/var/lib/postgresql
    healthcheck:
      # "Container started" is not "database accepting queries". Postgres runs
      # its init sequence first, and the api below waits on this check rather
      # than on the container merely existing.
      test: ["CMD-SHELL", "pg_isready -U ${BLUEPRINT_DB_USERNAME} -d ${BLUEPRINT_DB_DATABASE}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    # No volume, and that is on purpose. Presence is a claim about right now
    # that is stale within 30 seconds; every fact that must survive a restart is
    # in Postgres. Giving Redis a disk would only invite someone to put
    # something important in it.
    #
    # Since Stage 6 only presenced connects to this. The published port below is
    # for a person with redis-cli, not for the API nodes.
    #
    # Published on 6380, not 6379, in case a Redis is already running natively
    # on this machine — the same trap the database port fell into.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    # -js turns JetStream on, which is the whole reason NATS is here rather
    # than plain Pub/Sub: JetStream keeps the message until a consumer says the
    # work is done. -sd is where it keeps it.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      # Redis has no volume and this does, and the difference is the point.
      # Redis holds claims about right now that are stale in 30 seconds; this
      # holds messages that somebody still has to act on. A restart that lost
      # them would lose exactly the unread counts the stage was built to keep.
      - nats_volume:/data
    ports:
      # 4222 is the client port. 8222 is the monitoring page — open
      # http://localhost:8222/jsz?streams=1 to see the streams and the
      # consumers without installing the nats CLI.
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      # /healthz on the monitoring port. wget is what the alpine image has.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # Stage 6: the second service.
  #
  # It is built from the same image as the API nodes and runs a different
  # binary. It holds the only Redis connection in the system now.
  #
  # Kill it and watch what happens:
  #
  #   docker compose kill presenced
  #   curl -s localhost:8081/health | jq .presence
  #
  # The API nodes stay up, keep serving, keep delivering messages, and
  # GET /conversations/:id/presence starts answering 503. After five failed
  # calls each node's circuit breaker opens and those 503s become instant.
  presenced:
    build: .
    restart: unless-stopped
    command: ["presenced"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      NODE_ID: presenced
      PRESENCE_PORT: 9090
      PRESENCE_METRICS_PORT: 9091
      # The one thing this process needs. Unlike an API node, it refuses to
      # start without it: a presence service with nowhere to keep presence is a
      # configuration mistake, not a degraded mode.
      REDIS_ADDR: redis:6379
    ports:
      - "9095:9090"
      - "9096:9091"

  # Two nodes, not `deploy: replicas: 2`. Replicas share one name and one set
  # of published ports, and this stage needs to reach each node on purpose.
  #
  # Both run migrations at startup and that is safe: goose takes a Postgres
  # advisory lock (see internal/database/migrate.go), so the loser waits
  # instead of applying the same file twice.
  api1:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api1
    ports:
      - "8081:8080"

  api2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api2
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - api1
      - api2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"

  # Not started by default. `docker compose up` should stay a database, the
  # nodes and the proxy; watching graphs is a thing you ask for:
  #
  #   docker compose --profile observability up -d
  #
  # Stage 7 adds Grafana on top of this, which is why the scrape config lives
  # in the repo rather than being typed into a UI.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    depends_on:
      - api1
      - api2
      - presenced
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  psql_volume_bp:
  nats_volume:
